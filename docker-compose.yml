services:
  postgres:
    image: postgres:16-alpine
    container_name: nightpass-postgres
    environment:
      POSTGRES_USER: charlesdays
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nightpass_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: nightpass-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

